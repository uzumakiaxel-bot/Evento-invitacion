<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#77b8ff" />
  <title>¿Deseas ir al evento?</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
      --pixel: "Press Start 2P", monospace;
      --ink: #11162a;
      --green: #52c33a;
      --green-dark: #1b6224;
      --red: #d92c2c;
      --red-dark: #7b1717;
      --cream: #fffaf0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--pixel);
      color: var(--ink);
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background:
        linear-gradient(to bottom, #77baff 0 42%, #bfe9ff 42% 48%, #91d45a 48% 64%, #5cab35 64% 72%, #7a4f2c 72% 79%, #4b2f22 79% 100%);
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255,255,255,.18) 0 4%, transparent 4% 13%, rgba(255,255,255,.13) 13% 17%, transparent 17% 100%),
        linear-gradient(rgba(255,255,255,.1) 0 9%, transparent 9% 22%, rgba(255,255,255,.08) 22% 26%, transparent 26% 100%);
      background-size: 170px 130px, 230px 170px;
      opacity: .7;
      image-rendering: pixelated;
    }

    .world {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 16px 28px;
      position: relative;
      z-index: 2;
    }

    .cloud {
      position: fixed;
      width: 96px;
      height: 28px;
      background: rgba(255,255,255,.72);
      box-shadow:
        24px -18px 0 rgba(255,255,255,.72),
        48px 0 0 rgba(255,255,255,.72),
        72px -8px 0 rgba(255,255,255,.72);
      opacity: .8;
      filter: drop-shadow(0 3px 0 rgba(0,0,0,.08));
    }

    .cloud.one { top: 80px; left: 5vw; }
    .cloud.two { top: 120px; right: 8vw; transform: scale(.75); }

    .headline {
      text-align: center;
      max-width: 980px;
      margin: 2px auto 8px;
      color: white;
      font-size: clamp(1.15rem, 3.4vw, 2.25rem);
      line-height: 1.45;
      text-transform: uppercase;
      text-shadow:
        3px 3px 0 #17213c,
        -2px 2px 0 #17213c,
        2px -2px 0 #17213c,
        -2px -2px 0 #17213c,
        0 6px 0 rgba(0,0,0,.22);
    }

    .subheadline {
      color: #14213c;
      text-align: center;
      margin: 0 0 14px;
      font-size: clamp(.65rem, 2vw, .95rem);
      line-height: 1.7;
    }

    .speech {
      position: fixed;
      top: 30px;
      width: 150px;
      padding: 12px 10px;
      border: 3px solid rgba(22,78,150,.28);
      border-radius: 28px;
      background: rgba(255,255,255,.22);
      color: rgba(18,72,135,.6);
      text-align: center;
      font-size: .48rem;
      line-height: 1.55;
      backdrop-filter: blur(2px);
    }

    .speech.left { left: 18px; transform: rotate(-8deg); }
    .speech.right { right: 18px; transform: rotate(7deg); }

    .card {
      width: min(94vw, 470px);
      min-height: min(690px, calc(100vh - 150px));
      max-height: 760px;
      background:
        linear-gradient(rgba(255,255,255,.90), rgba(255,255,255,.82)),
        linear-gradient(to bottom, #dff4ff 0 58%, #9ad969 58% 72%, #6ab448 72% 78%, #704829 78% 100%);
      border: 4px solid rgba(255,255,255,.9);
      outline: 3px solid rgba(56,112,178,.22);
      border-radius: 24px;
      box-shadow:
        0 18px 0 rgba(63,40,25,.18),
        0 28px 60px rgba(32,51,89,.28);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 34%;
      pointer-events: none;
      background:
        linear-gradient(to bottom, transparent 0 22%, rgba(69,154,50,.4) 22% 28%, transparent 28%),
        repeating-linear-gradient(90deg, rgba(72,137,44,.16) 0 18px, rgba(120,190,76,.12) 18px 34px);
    }

    .tree {
      position: absolute;
      width: 58px;
      height: 170px;
      bottom: 90px;
      opacity: .52;
    }

    .tree::before {
      content: "";
      position: absolute;
      width: 30px;
      height: 125px;
      left: 14px;
      bottom: 0;
      background: repeating-linear-gradient(to bottom, #80552f 0 16px, #6d4529 16px 30px);
    }

    .tree::after {
      content: "";
      position: absolute;
      width: 76px;
      height: 76px;
      left: -9px;
      top: 0;
      background:
        linear-gradient(90deg, transparent 0 10px, #4f9e39 10px 66px, transparent 66px),
        linear-gradient(#65b748 0 0);
      box-shadow: 18px 38px 0 #559f3d, -16px 32px 0 #6ab84c;
      image-rendering: pixelated;
    }

    .tree.t1 { left: -16px; }
    .tree.t2 { right: -14px; transform: scale(.9); }

    .card-content {
      position: relative;
      z-index: 3;
      flex: 1;
      padding: 24px 20px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .grass-block {
      width: 58px;
      height: 58px;
      margin-top: 4px;
      position: relative;
      background:
        linear-gradient(to bottom, #55c934 0 18px, #7a532f 18px 100%);
      border: 4px solid #26210f;
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.08), 4px 5px 0 rgba(0,0,0,.18);
      transform: rotate(2deg);
    }

    .grass-block::after {
      content: "";
      position: absolute;
      inset: 18px 0 0;
      background:
        linear-gradient(90deg, transparent 0 8px, rgba(87,54,31,.6) 8px 16px, transparent 16px 26px, rgba(160,104,58,.5) 26px 38px, transparent 38px);
    }

    h1 {
      font-size: clamp(1.15rem, 4vw, 1.6rem);
      line-height: 1.5;
      text-align: center;
      margin: 26px 0 14px;
      text-shadow: 2px 2px 0 rgba(255,255,255,.8);
    }

    .desc {
      margin: 0;
      max-width: 360px;
      text-align: center;
      font-family: system-ui, sans-serif;
      font-weight: 700;
      font-size: 1.08rem;
      line-height: 1.45;
      color: #24345e;
    }

    .heart {
      margin-top: 14px;
      font-size: 34px;
      filter: drop-shadow(2px 3px 0 rgba(0,0,0,.22));
    }

    .playground {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 250px;
      margin-top: 4px;
    }

    button {
      font-family: var(--pixel);
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }

    #yesBtn {
      position: absolute;
      left: 30%;
      top: 32%;
      transform: translate(-50%, -50%) scale(1);
      width: 170px;
      min-height: 94px;
      border: 5px solid #123f1c;
      border-radius: 10px;
      background:
        linear-gradient(rgba(255,255,255,.08), rgba(0,0,0,.08)),
        repeating-linear-gradient(90deg, #69d44d 0 18px, #5bc741 18px 36px);
      box-shadow:
        inset 0 0 0 4px #82eb68,
        0 8px 0 #15491f,
        0 14px 20px rgba(0,0,0,.28);
      color: white;
      font-size: 1.1rem;
      text-shadow: 2px 3px 0 rgba(0,0,0,.45);
      transition: left .24s ease, top .24s ease, transform .24s ease, filter .2s;
      z-index: 5;
      overflow: hidden;
    }

    #yesBtn .face {
      position: absolute;
      left: 14px;
      top: 20px;
      width: 56px;
      height: 50px;
    }

    #yesBtn .face::before {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      left: 4px;
      top: 2px;
      background: #163b1d;
      box-shadow:
        34px 0 0 #163b1d,
        17px 16px 0 #163b1d,
        10px 28px 0 #163b1d,
        24px 28px 0 #163b1d;
    }

    #yesBtn .label {
      display: block;
      margin-left: 60px;
    }

    #noBtn {
      position: absolute;
      left: 70%;
      top: 32%;
      transform: translate(-50%, -50%);
      width: 126px;
      min-height: 90px;
      padding-top: 22px;
      border: 5px solid #751313;
      border-radius: 10px;
      background:
        linear-gradient(rgba(255,255,255,.08), rgba(0,0,0,.12)),
        repeating-linear-gradient(90deg, #e53935 0 16px, #cd2929 16px 32px);
      box-shadow:
        inset 0 0 0 4px #f4554f,
        0 8px 0 #7f1818,
        0 14px 20px rgba(0,0,0,.28);
      color: white;
      font-size: .9rem;
      text-shadow: 2px 3px 0 rgba(0,0,0,.45);
      transition: left .2s ease, top .2s ease, transform .2s ease;
      z-index: 6;
    }

    #noBtn::before {
      content: "TNT";
      position: absolute;
      top: 8px;
      left: 20px;
      right: 20px;
      padding: 3px 0;
      background: #f1dfc6;
      color: #2a1711;
      font-size: .45rem;
      border: 2px solid #6c3526;
      text-shadow: none;
    }

    .wood-sign {
      position: absolute;
      left: 16px;
      bottom: 28px;
      width: 148px;
      padding: 12px 10px;
      background: #d38a32;
      border: 4px solid #76501f;
      box-shadow: inset 0 0 0 3px rgba(255,210,120,.35), 5px 7px 0 rgba(0,0,0,.2);
      color: #271a10;
      font-size: .54rem;
      line-height: 1.6;
      text-align: center;
      transform: rotate(-4deg);
      z-index: 4;
    }

    .wood-sign::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 44px;
      background: #76501f;
      left: 62px;
      bottom: -45px;
    }





    .message {
      position: absolute;
      left: 62%;
      bottom: 70px;
      transform: translateX(-50%);
      width: 66%;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #23355c;
      font-family: system-ui, sans-serif;
      font-size: .98rem;
      font-weight: 800;
      z-index: 8;
    }

    .status {
      margin-top: 12px;
      padding: 13px 18px;
      min-width: min(90vw, 390px);
      border-radius: 999px;
      background: rgba(27,24,33,.88);
      color: white;
      font-family: system-ui, sans-serif;
      font-weight: 700;
      text-align: center;
      font-size: .88rem;
      box-shadow: 0 6px 0 rgba(0,0,0,.14);
    }

    .boom-particle {
      position: absolute;
      width: 18px;
      height: 18px;
      z-index: 20;
      pointer-events: none;
      background: #67d64c;
      border: 3px solid #174b1f;
      image-rendering: pixelated;
      animation: particleFly .85s ease-out forwards;
    }

    @keyframes particleFly {
      from {
        transform: translate(0,0) rotate(0deg) scale(1);
        opacity: 1;
      }
      to {
        transform: translate(var(--dx), var(--dy)) rotate(260deg) scale(.4);
        opacity: 0;
      }
    }

    #yesBtn.explode {
      animation: creeperBoom .72s ease-out forwards;
    }

    @keyframes creeperBoom {
      0%   { transform: translate(-50%,-50%) scale(var(--boom-scale,1)); filter: brightness(1); }
      18%  { transform: translate(-50%,-50%) scale(calc(var(--boom-scale,1) * 1.15)); filter: brightness(1.8); }
      40%  { transform: translate(-50%,-50%) scale(calc(var(--boom-scale,1) * .9)); filter: brightness(3.2); }
      60%  { transform: translate(-50%,-50%) scale(calc(var(--boom-scale,1) * 1.6)); filter: brightness(5); opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(calc(var(--boom-scale,1) * 2.3)); filter: brightness(7); opacity: 0; }
    }

    .flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
      background: radial-gradient(circle, rgba(255,255,255,.95) 0 6%, rgba(191,255,146,.75) 14%, rgba(87,219,61,.2) 36%, transparent 65%);
      opacity: 0;
    }

    .flash.active {
      animation: screenFlash .7s ease-out;
    }

    @keyframes screenFlash {
      0% { opacity: 0; }
      20% { opacity: 1; }
      100% { opacity: 0; }
    }

    .success-screen {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 18px 120px;
      text-align: center;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.96) 0 22%, rgba(232,255,217,.9) 45%, rgba(255,255,255,.72) 70%, transparent 100%);
    }

    .success-screen.show {
      display: flex;
      animation: successIn .4s ease-out;
    }

    @keyframes successIn {
      from { opacity: 0; transform: scale(.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .perfect {
      font-size: clamp(1.35rem, 5vw, 2.1rem);
      color: #75e647;
      text-shadow:
        3px 3px 0 #17391c,
        -2px 2px 0 #17391c,
        2px -2px 0 #17391c,
        0 6px 0 rgba(0,0,0,.18);
      margin-bottom: 18px;
    }

    .success-copy {
      max-width: 330px;
      font-family: system-ui, sans-serif;
      color: #20305a;
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.5;
    }

    .boom-word {
      margin-top: 24px;
      font-size: 1.7rem;
      transform: rotate(-8deg);
      color: #17200f;
      text-shadow: 3px 3px 0 #fff;
    }

    .creeper-burst {
      position: relative;
      width: 160px;
      height: 120px;
      margin: 8px 0;
    }

    .creeper-burst span {
      position: absolute;
      width: 34px;
      height: 34px;
      background: #4fc233;
      border: 4px solid #14451c;
    }

    .creeper-burst span:nth-child(1) { left: 62px; top: 38px; transform: scale(1.6); }
    .creeper-burst span:nth-child(2) { left: 4px; top: 24px; transform: rotate(-18deg); }
    .creeper-burst span:nth-child(3) { right: 3px; top: 10px; transform: rotate(18deg); }
    .creeper-burst span:nth-child(4) { left: 26px; bottom: 2px; transform: rotate(11deg); }
    .creeper-burst span:nth-child(5) { right: 30px; bottom: 0; transform: rotate(-15deg); }

    @media (max-width: 720px) {
      .speech { display: none; }

      .world {
        padding-top: 12px;
      }

      .headline {
        font-size: clamp(1rem, 6vw, 1.45rem);
        margin-top: 0;
      }

      .subheadline {
        font-size: .62rem;
        margin-bottom: 10px;
      }

      .card {
        width: min(94vw, 430px);
        min-height: 600px;
        max-height: calc(100vh - 135px);
      }

      .card-content {
        padding: 18px 14px 14px;
      }

      .grass-block {
        width: 50px;
        height: 50px;
      }

      h1 {
        margin-top: 18px;
      }

      .desc {
        font-size: .95rem;
      }

      #yesBtn {
        left: 30%;
        width: 155px;
        min-height: 88px;
      }

      #noBtn {
        left: 70%;
        width: 112px;
        min-height: 84px;
      }

      .wood-sign {
        width: 128px;
        font-size: .46rem;
        left: 10px;
      }


      .message {
        bottom: 65px;
        font-size: .9rem;
      }
    }

    @media (max-height: 730px) {
      .headline {
        font-size: 1rem;
        line-height: 1.35;
      }

      .subheadline {
        display: none;
      }

      .card {
        min-height: 560px;
        max-height: 610px;
      }

      .grass-block {
        width: 44px;
        height: 44px;
      }

      h1 {
        margin: 12px 0 8px;
        font-size: 1rem;
      }

      .desc {
        font-size: .85rem;
      }

      .heart {
        margin-top: 6px;
        font-size: 26px;
      }

      .playground {
        min-height: 220px;
      }

      .status {
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>
  <div class="flash" id="flash"></div>
  <div class="cloud one"></div>
  <div class="cloud two"></div>

  <div class="speech left">lAS AVENTURAS<br>SON MEJORES<br>ACOMPAÑADO ♥</div>
  <div class="speech right">¿TE ANIMAS?<br>¡SERÁ<br>INCREÍBLE! ♥</div>

  <main class="world">
    <div class="headline">¡El evento es en CDMX <br> y estara todo el año! </div>

    <section class="card" id="card">
      <div class="tree t1"></div>
      <div class="tree t2"></div>

      <div class="card-content" id="mainContent">
        <div class="grass-block"></div>

        <h1>¿Me acompañas <br>al evento?</h1>

        <div class="playground" id="playground">
          <button id="yesBtn" type="button" aria-label="Sí, deseo ir al evento">
            <span class="face" aria-hidden="true"></span>
            <span class="label">Sí</span>
          </button>

          <button id="noBtn" type="button" aria-label="No deseo ir al evento">No</button>
        </div>

        <div class="message" id="message"></div>

        <div class="wood-sign" id="sign">
          ¡SERÁ<br>INCREÍBLE<br>CONTAR<br>CONTIGO! ♥
        </div>

      </div>

      <div class="success-screen" id="successScreen">
        <div class="perfect">¡PERFECTO!</div>
        <div class="success-copy">
          Gracias por confirmar tu asistencia.<br>
          ¡Nos vemos en el evento! ❤️
        </div>
        <div class="creeper-burst" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="boom-word">¡BOOM!</div>
      </div>
    </section>

    <div class="status" id="status">
      Estado inicial
    </div>
  </main>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwYDKofgWYp-ZHmsv_XFzATMOYV62impwETjf7YtyZCjy_n0rVWgT4IShUAD-D_-TAk/exec";

    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const playground = document.getElementById("playground");
    const message = document.getElementById("message");
    const successScreen = document.getElementById("successScreen");
    const flash = document.getElementById("flash");
    const status = document.getElementById("status");

    let attempts = 0;
    let yesScale = 1;
    let finished = false;
    const startTime = Date.now();

    const phrases = [
      "¿Seguro? 👀",
      "Piénsalo bien 😏",
      "El Creeper está creciendo...",
      "Ese TNT es muy escurridizo 😂",
      "Creo que el Sí ya decidió por ti 😌",
      "Ya casi no queda tiempo para decir que no 😏"
    ];

    function escapeNo() {
      if (finished) return;

      attempts += 1;
      yesScale = Math.min(yesScale + 0.16, 2.05);

      // En el octavo intento de pulsar "No", activa automáticamente el "Sí".
      if (attempts >= 8) {
        message.textContent = "Ya fueron 8 intentos... el Creeper decidió 💚";
        status.textContent = "8 intentos de “No” · activando “Sí” automáticamente...";
        yesBtn.style.left = "50%";
        yesBtn.style.top = "32%";
        yesBtn.style.transform = `translate(-50%, -50%) scale(${yesScale})`;

        setTimeout(() => {
          confirmYes();
        }, 450);
        return;
      }

      yesBtn.style.left = "50%";
      yesBtn.style.top = "32%";
      yesBtn.style.transform = `translate(-50%, -50%) scale(${yesScale})`;

      const area = playground.getBoundingClientRect();
      const btn = noBtn.getBoundingClientRect();

      const pad = 8;
      const maxX = Math.max(pad, area.width - btn.width - pad);
      const maxY = Math.max(pad, area.height - btn.height - pad);

      let x = pad + Math.random() * Math.max(1, maxX - pad);
      let y = pad + Math.random() * Math.max(1, maxY - pad);

      // Avoid placing No directly on top of the centered Yes button.
      if (x > area.width * .28 && x < area.width * .68 &&
          y > area.height * .25 && y < area.height * .72) {
        x = Math.random() < .5 ? pad : maxX;
      }

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
      noBtn.style.transform = "none";

      message.textContent = phrases[Math.min(attempts - 1, phrases.length - 1)];
      status.textContent = `Intentos de “No”: ${attempts} · el “Sí” crece y se centra`;
    }

    function makeExplosionParticles() {
      const area = playground.getBoundingClientRect();
      const rect = yesBtn.getBoundingClientRect();

      const originX = rect.left - area.left + rect.width / 2;
      const originY = rect.top - area.top + rect.height / 2;

      for (let i = 0; i < 26; i++) {
        const p = document.createElement("span");
        p.className = "boom-particle";
        p.style.left = `${originX - 9}px`;
        p.style.top = `${originY - 9}px`;

        const angle = (Math.PI * 2 * i) / 26 + (Math.random() * .18);
        const distance = 80 + Math.random() * 135;
        p.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
        p.style.setProperty("--dy", `${Math.sin(angle) * distance}px`);

        playground.appendChild(p);
        setTimeout(() => p.remove(), 900);
      }
    }

    async function confirmYes() {
      if (finished) return;
      finished = true;

      const tiempoSegundos = Math.max(1, Math.round((Date.now() - startTime) / 1000));

      noBtn.style.display = "none";
      yesBtn.disabled = true;
      yesBtn.style.setProperty("--boom-scale", yesScale);
      yesBtn.classList.add("explode");

      makeExplosionParticles();

      flash.classList.remove("active");
      void flash.offsetWidth;
      flash.classList.add("active");

      message.textContent = "💥 ¡BOOM! Guardando tu respuesta...";
      status.textContent = attempts === 0
        ? "¡Sí al primer intento! ❤️"
        : `Confirmado después de ${attempts} intento${attempts === 1 ? "" : "s"} de “No”`;

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            respuesta: "Sí",
            nombre: "",
            intentosNo: attempts,
            tiempoSegundos: tiempoSegundos
          })
        });
      } catch (error) {
        console.error("No se pudo registrar la respuesta:", error);
      }

      setTimeout(() => {
        successScreen.classList.add("show");
        message.textContent = "";
      }, 720);
    }

    noBtn.addEventListener("pointerenter", (e) => {
      if (e.pointerType === "mouse") escapeNo();
    });

    noBtn.addEventListener("pointerdown", (e) => {
      if (e.pointerType !== "mouse") {
        e.preventDefault();
        escapeNo();
      }
    });

    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      if (e.detail === 0) escapeNo();
    });

    yesBtn.addEventListener("click", confirmYes);
  </script>
</body>
</html>
